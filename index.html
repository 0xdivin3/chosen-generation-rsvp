<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Will Be Attending - Chosen Generation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Montserrat:wght@600;700&display=swap">
<style>
:root{--bg:#fbf4ee;--fg:#3a0d0e;--mut:#7a4a44;--card:#fff;--line:#e3c9b8;--gold:#d99a1c;--red:#8a1a1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0707;--fg:#fbeedd;--mut:#c79b8c;--card:#2a0e0e;--line:#5a2420}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Montserrat',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:1.35rem;margin:4px 0 14px;text-align:center}
.wrap{width:100%;max-width:520px}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;cursor:grab;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;display:grid;gap:12px}
label{font-size:.85rem;font-weight:600;color:var(--mut);display:grid;gap:6px}
input[type=text]{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1rem}
input[type=range]{width:100%;accent-color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;padding:13px 16px;border-radius:10px;border:0;cursor:pointer;font-size:1rem}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pick{background:var(--card);color:var(--fg);border:2px dashed var(--gold)}
.dl{background:linear-gradient(180deg,#f2b632,#c77f12);color:#3a0d0e}
.dl:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{font-size:.78rem;color:var(--mut);margin:0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>I will be attending</h1>
<canvas id="c" width="1080" height="1440" aria-label="Flyer preview"></canvas>
<div class="panel">
<input id="file" type="file" accept="image/*" hidden>
<button class="btn pick" id="pick" type="button"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Choose your photo</button>
<label>Your name<input id="name" type="text" maxlength="28" placeholder="Type your name" autocomplete="name"></label>
<label>Zoom<input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
<p class="hint">Drag the photo inside the circle to position it.</p>
<button class="btn dl" id="dl" type="button" disabled><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Download my flyer</button>
</div>
</div>

let photo=null,zoom=1,ox=0,oy=0,name='';
const GOLD=['#fff0b0','#f2b632','#b8740f','#f7d56a'];

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function goldGrad(x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);GOLD.forEach((c,i)=>g.addColorStop(i/3,c));return g}
function clamp(){if(!photo)return;const s=Math.max(2*R/photo.width,2*R/photo.height)*zoom;
const mx=Math.max(0,(photo.width*s-2*R)/2),my=Math.max(0,(photo.height*s-2*R)/2);
ox=Math.min(mx,Math.max(-mx,ox));oy=Math.min(my,Math.max(-my,oy))}

function draw(){
ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0,W,H);
// ring glow
ctx.save();ctx.shadowColor='rgba(255,170,40,.75)';ctx.shadowBlur=45;
ctx.beginPath();ctx.arc(CX,CY,R+16,0,7);ctx.fillStyle=goldGrad(CX-R,CY-R,CX+R,CY+R);ctx.fill();ctx.restore();
ctx.beginPath();ctx.arc(CX,CY,R+4,0,7);ctx.fillStyle='#8a4a0a';ctx.fill();
// photo or blank
ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.clip();
ctx.fillStyle='#f6ecdc';ctx.fillRect(CX-R,CY-R,2*R,2*R);
if(photo){const s=Math.max(2*R/photo.width,2*R/photo.height)*zoom,w=photo.width*s,h=photo.height*s;
ctx.drawImage(photo,CX-w/2+ox,CY-h/2+oy,w,h)}
ctx.restore();
// name bar
const bx=CX-215,by=960,bw=430,bh=74;
ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=14;rr(bx,by,bw,bh,37);ctx.fillStyle='rgba(250,240,225,.93)';ctx.fill();ctx.restore();
rr(bx,by,bw,bh,37);ctx.lineWidth=4;ctx.strokeStyle=goldGrad(bx,by,bx+bw,by+bh);ctx.stroke();
if(name){let fs=38;ctx.font=`700 ${fs}px Montserrat,sans-serif`;
while(ctx.measureText(name).width>bw-60&&fs>16){fs--;ctx.font=`700 ${fs}px Montserrat,sans-serif`}
ctx.fillStyle='#5a0f10';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(name,CX,by+bh/2+2)}
// ribbon
const y0=1062,h=100,x1=CX-185,x2=CX+185;
ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=14;
[[-1],[1]].forEach(([d])=>{const xo=CX+d*240,xi=CX+d*175;ctx.beginPath();
ctx.moveTo(xo,y0+14);ctx.lineTo(xi,y0+14);ctx.lineTo(xi,y0+h+14);ctx.lineTo(xo,y0+h+14);ctx.lineTo(xo-d*30,y0+h/2+14);ctx.closePath();
ctx.fillStyle='#5c0e10';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#c8921c';ctx.stroke()});
ctx.restore();
const g=ctx.createLinearGradient(0,y0,0,y0+h);g.addColorStop(0,'#9a1f1f');g.addColorStop(1,'#4d0a0c');
ctx.fillStyle=g;ctx.fillRect(x1,y0,x2-x1,h);
ctx.lineWidth=4;ctx.strokeStyle=goldGrad(x1,y0,x2,y0);ctx.strokeRect(x1,y0,x2-x1,h);
ctx.textAlign='center';ctx.textBaseline='alphabetic';
ctx.font="30px 'Alfa Slab One',Georgia,serif";ctx.fillStyle='#fff';ctx.fillText('I WILL BE',CX,y0+38);
ctx.font="44px 'Alfa Slab One',Georgia,serif";ctx.fillStyle=goldGrad(CX-150,y0+45,CX+150,y0+90);ctx.fillText('ATTENDING',CX,y0+84);
}

function load(f){const i=new Image();i.onload=()=>{photo=i;zoom=1;ox=oy=0;zoomEl.value=1;upd();draw()};i.src=URL.createObjectURL(f)}
function upd(){document.getElementById('dl').disabled=!photo}
const zoomEl=document.getElementById('zoom');
document.getElementById('pick').onclick=()=>file.click();
const file=document.getElementById('file');file.onchange=()=>file.files[0]&&load(file.files[0]);
document.getElementById('name').oninput=e=>{name=e.target.value.trim().toUpperCase();draw()};
zoomEl.oninput=()=>{zoom=+zoomEl.value;clamp();draw()};
// drag
let drag=null;
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.onpointerdown=e=>{if(!photo)return;drag={p:pt(e),ox,oy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointermove=e=>{if(!drag)return;const p=pt(e);ox=drag.ox+p.x-drag.p.x;oy=drag.oy+p.y-drag.p.y;clamp();draw()};
cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};
document.getElementById('dl').onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
a.download=(name?name.toLowerCase().replace(/\s+/g,'-'):'attendee')+'-i-will-be-attending.png';a.click()},'image/png')};
bg.onload=draw;
(document.fonts?Promise.all([document.fonts.load("30px 'Alfa Slab One'"),document.fonts.load('700 30px Montserrat')]):Promise.resolve()).then(draw,draw);
</script>
</body>
</html>
